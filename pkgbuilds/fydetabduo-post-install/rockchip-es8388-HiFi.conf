# Everest ES8388 on the Fydetab Duo (rk-multicodecs card "rockchip-es8388").
# Ported from openFyde's UCM v1 profile (chromeos-bsp-inaugural
# ucm-config/HiFi-nomic.conf); the internal mic is the separate
# rockchip-dmic card, so this card only has the headset mic on capture.
#
# The codec's OUT1/OUT2 switches are register-less DAPM switches that boot
# disconnected, and the speaker/headphone amp GPIOs are only raised by DAPM
# once a powered path exists -- without this EnableSequence the card is
# silent by construction.

SectionVerb {
	EnableSequence [
		cset "name='Left Mixer Left Playback Switch' on"
		cset "name='Right Mixer Right Playback Switch' on"
		cset "name='OUT1 Switch' on"
		cset "name='OUT2 Switch' on"
		cset "name='PCM Volume' 192"
		cset "name='Output 1 Playback Volume' 27"
		cset "name='Output 2 Playback Volume' 28"
		cset "name='Left PGA Mux' DifferentialL"
		cset "name='Right PGA Mux' DifferentialR"
		cset "name='Capture Digital Volume' 120"
		cset "name='Left Channel Capture Volume' 3"
		cset "name='Right Channel Capture Volume' 3"
		cset "name='ALC Capture NG Threshold' 12"
		cset "name='Capture Mute' off"
		cset "name='3D Mode' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"

	ConflictingDevice [ "Headphones" ]

	EnableSequence [
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [ "Speaker" ]

	EnableSequence [
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	EnableSequence [
		cset "name='Differential Mux' 'Line 1'"
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		JackControl "Headset Mic Jack"
	}
}
