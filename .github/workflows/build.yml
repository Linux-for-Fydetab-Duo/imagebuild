# Builds the fyde pacman repository and the flashable image.
#
# Triggers:
#   - push of a prod-* tag: full build, image attached to a Release
#   - push of a stag-* tag: same, marked pre-release
#   - workflow_dispatch:    full build, image kept as a workflow artifact
#
# Profile selection (which image gets built):
#   - workflow_dispatch: the "profile" choice input (Run workflow dropdown)
#   - tags: prod-omarchy-* / stag-omarchy-* build the omarchy image;
#     any other prod-* / stag-* tag builds arch-gnome as before
# One profile per run: a second image would double the runner's disk and
# wall-clock cost; run the workflow once per profile instead. The package
# step is profile-independent -- every run tops up the same rolling repo.
#
# Package builds are incremental: the job seeds ./repo from the rolling
# "repo" Release, and pkg/build-pkg.sh skips every PKGBUILD whose version
# is already present, so a run only pays for what changed. The rolling
# Release is updated back at the end of every run, which also lets
# devices use it directly as a pacman server:
#   Server = https://github.com/<owner>/<repo>/releases/download/repo
name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Image profile to build"
        type: choice
        options:
          - arch-gnome
          - omarchy
        default: arch-gnome
  push:
    tags:
      - 'prod-*'
      - 'stag-*'

permissions:
  contents: write

# The rolling "repo" release is mutable shared state; never let two runs
# write it concurrently.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image profile
        id: profile
        run: |
          case "$GITHUB_REF_NAME" in
            prod-omarchy-*|stag-omarchy-*) p=omarchy ;;
            prod-*|stag-*)                 p=arch-gnome ;;
            *) p="${{ inputs.profile }}"; p="${p:-arch-gnome}" ;;
          esac
          echo "building image profile: $p"
          echo "profile=$p" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Registers qemu-aarch64 in binfmt_misc with the F (fix-binary)
      # flag build.sh insists on.
      - name: Set up QEMU binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # cache/ holds the ALARM base tarball, kernel git clone, source
      # tarballs, pacstrap bootstrap and pacman package caches. Key on
      # run_id so every run saves; restore the most recent.
      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: cache
          key: buildcache-${{ github.run_id }}
          restore-keys: |
            buildcache-

      - name: Seed pacman repo from the rolling release
        run: |
          mkdir -p repo/fyde/aarch64
          if gh release view repo >/dev/null 2>&1; then
            cd repo/fyde/aarch64
            gh release download repo -p '*.pkg.tar.zst' \
              -p 'fyde.db.tar.gz' -p 'fyde.files.tar.gz'
            ln -sf fyde.db.tar.gz fyde.db
            ln -sf fyde.files.tar.gz fyde.files
            # The release can carry superseded package files (uploads only
            # replace same-name assets), and seeding two generations of one
            # package breaks `repo-add --new --remove`: while processing the
            # older file it deletes the db-referenced newer one from disk,
            # then errors on it (broke CI 2026-08-18). The db is the truth --
            # drop every seeded package file it does not reference.
            tar -xzf fyde.db.tar.gz --wildcards '*/desc' -O 2>/dev/null |
              grep -A1 '%FILENAME%' | grep '\.pkg\.tar\.zst$' | sort > /tmp/db-files
            for f in *.pkg.tar.zst; do
              grep -qxF "$f" /tmp/db-files || { echo "pruning unreferenced $f"; rm -f "$f"; }
            done
            ls -la
          else
            echo "no rolling repo release yet -- building from scratch"
          fi

      - name: Build containers
        run: ./build.sh containers

      - name: Sync published packages
        run: ./build.sh sync

      - name: Build packages
        run: ./build.sh pkg

      - name: Build image
        run: ./build.sh image "${{ steps.profile.outputs.profile }}"

      - name: Publish pacman repo to the rolling release
        run: |
          gh release view repo >/dev/null 2>&1 || \
            gh release create repo --title "fyde package repository" \
              --notes "Rolling pacman repository, updated by CI. Use as:
          Server = https://github.com/${{ github.repository }}/releases/download/repo" \
              --latest=false
          cd repo/fyde/aarch64
          # gh uploads symlink targets under the link's name, so fyde.db /
          # fyde.files arrive as the plain files pacman expects.
          # Not --clobber: it 404s on stale asset ids. Delete by name
          # (tolerating absence) and upload fresh instead.
          # Caveat: GitHub sanitizes ':' in asset names (grub-2:2.12 became
          # grub-2.2.12), so epoch-versioned packages cannot round-trip
          # through the rolling release -- keep them out of the repo.
          files=(fyde.db fyde.files fyde.db.tar.gz fyde.files.tar.gz
                 *.pkg.tar.zst)
          for f in "${files[@]}"; do
            gh release delete-asset repo "$f" -y 2>/dev/null || true
          done
          gh release upload repo "${files[@]}"
          # Prune release assets that are no longer in the repo dir, so the
          # release always mirrors the dir exactly and the next run's seed
          # gets exactly one generation of every package.
          gh release view repo --json assets -q '.assets[].name' |
            grep '\.pkg\.tar\.zst$' | while read -r a; do
              [ -f "$a" ] || { echo "deleting superseded asset $a"
                gh release delete-asset repo "$a" -y || true; }
            done

      - name: Upload image artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ steps.profile.outputs.profile }}
          path: out/*.img.xz
          retention-days: 14

      - name: Release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in stag-*) prerelease="--prerelease" ;; esac
          # Idempotent for re-pushed tags: reuse the release if it exists
          # and replace its image assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            for f in out/*.img.xz; do
              gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$f")" -y \
                2>/dev/null || true
            done
            gh release upload "$GITHUB_REF_NAME" out/*.img.xz
          else
            gh release create "$GITHUB_REF_NAME" $prerelease \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              out/*.img.xz
          fi
