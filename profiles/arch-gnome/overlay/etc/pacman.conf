# /etc/pacman.conf
# 
# 
# See the pacman.conf(5) manpage for option and repository directives

# 
# GENERAL OPTIONS
# 
[options]
# IgnorePkg = 
# RootDir = /
# DBPath = /var/lib/pacman/
# CacheDir = /var/cache/pacman/pkg/
# LogFile = /var/log/pacman.log
# GPGDir = /etc/pacman.d/gnupg/
# HookDir = /etc/pacman.d/hooks/
HoldPkg = pacman glibc
# XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
# XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
# CleanMethod = KeepInstalled
Architecture = aarch64
# IgnorePkg = 
# IgnoreGroup = 
# NoUpgrade = 
# NoExtract = 
# UseSyslog
Color
ILoveCandy
# NoProgressBar
CheckSpace
# VerbosePkgLists
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
# RemoteFileSigLevel = Required

[fyde]
# The packages this project builds are not signed (the historical fyde
# signing key is not ours to use); integrity rides on HTTPS, same as
# [7Ji] below. Revisit when CI signing lands.
SigLevel = Optional TrustAll
Server = https://github.com/Linux-for-Fydetab-Duo/imagebuild/releases/download/repo

[7Ji]
SigLevel = Never
Server = https://github.com/7Ji/archrepo/releases/download/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
