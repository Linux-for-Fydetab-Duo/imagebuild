# Restore the Omarchy greeter theme over the board package's override.
#
# sddm merges /usr/lib/sddm/sddm.conf.d/*.conf, then /etc/sddm.conf.d/*.conf in
# name order, last file wins. Two other packages drop files in here:
#   omarchy-settings   10-theme.conf   Theme/Current=omarchy
#                      10-wayland.conf DisplayServer=wayland, greeter compositor
#   fydetabduo-post-install  fydetab.conf  Theme/Current=breeze, Users/*
# 'f' sorts after '1', so fydetab.conf would leave the greeter asking for the
# uninstalled breeze theme. This file sorts last on purpose and puts the
# Omarchy theme back.
#
# No [Autologin] section here: omarchy-provision-owner owns that posture and
# writes autologin.conf, which sorts earlier -- an [Autologin] key in this file
# would win over it.

[Theme]
Current=omarchy

# Parity with upstream's 99-omarchy-login.conf.
[Users]
RememberLastUser=true
RememberLastSession=true
