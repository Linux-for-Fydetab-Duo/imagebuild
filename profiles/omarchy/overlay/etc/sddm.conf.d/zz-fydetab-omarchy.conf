# Live-image session: log the built-in 'omarchy' user straight into Omarchy.
#
# sddm merges /usr/lib/sddm/sddm.conf.d/*.conf, then /etc/sddm.conf.d/*.conf in
# name order, last file wins. Two other packages drop files in here:
#   omarchy-settings   10-theme.conf   Theme/Current=omarchy
#                      10-wayland.conf DisplayServer=wayland, greeter compositor
#   fydetabduo-post-install  fydetab.conf  Theme/Current=breeze, Users/*
# 'f' sorts after '1', so fydetab.conf would leave the greeter asking for the
# uninstalled breeze theme. This file sorts last on purpose and puts the
# Omarchy theme back.
#
# Session= names the .desktop file omarchy-settings installs to
# /usr/local/share/wayland-sessions/, which is the first entry of sddm's
# default [Wayland] SessionDir.
[Autologin]
User=omarchy
Session=omarchy.desktop

[Theme]
Current=omarchy

# Upstream's ISO writes these into 99-omarchy-login.conf; they only matter
# once autologin is off, but ship them for parity. The ISO also seeds
# /var/lib/sddm/state.conf chowned sddm:sddm -- not portable here while the
# overlay replaces /etc/passwd (no sddm user at build time); autologin makes
# it moot anyway.
[Users]
RememberLastUser=true
RememberLastSession=true
