# vim:set ft=sh
# MODULES
# The following modules are loaded before any boot hooks are
# run.  Advanced users may wish to specify all system modules
# in this array.  For instance:
#     MODULES=(usbhid xhci_hcd)
MODULES=(nvme)

# BINARIES
# This setting includes any additional binaries a given user may
# wish into the CPIO image.  This is run last, so it may be used to
# override the actual binaries included by a given hook
# BINARIES are dependency parsed, so you may safely ignore libraries
BINARIES=()

# FILES
# This setting is similar to BINARIES above, however, files are added
# as-is and are not parsed in any way.  This is useful for config files.
#
# The Mali CSF firmware must ride in the initramfs: CONFIG_DRM_PANTHOR=y means
# panthor is built into the kernel and probes during early init, where a failed
# request_firmware() fails the probe for good -- the root filesystem is not
# mounted yet at that point. The initramfs is unpacked before driver probes
# run, so shipping the blob here makes the probe succeed regardless of timing.
# (FydeOS solves the same problem by compiling the blob into vmlinux via
# CONFIG_EXTRA_FIRMWARE.) The kms hook cannot do this automatically because it
# discovers firmware through module metadata, and panthor is not a module.
#
# linux-firmware ships arch10.8 as a symlink to ../arch10.10/mali_csffw.bin;
# both entries are listed so the initramfs holds the real blob regardless of
# whether add_file dereferences the link.
FILES=(/usr/lib/firmware/arm/mali/arch10.8/mali_csffw.bin
       /usr/lib/firmware/arm/mali/arch10.10/mali_csffw.bin)

# HOOKS
# This is the most important setting in this file.  The HOOKS control the
# modules and scripts added to the image, and what happens at boot time.
# Order is important, and it is recommended that you do not change the
# order in which HOOKS are added.  Run 'mkinitcpio -H <hook name>' for
# help on a given hook.
# 'base' is _required_ unless you know precisely what you are doing.
# 'udev' is _required_ in order to automatically load modules
# 'filesystems' is _required_ unless you specify your fs modules in MODULES
# Examples:
##   This setup specifies all modules in the MODULES setting above.
##   No RAID, lvm2, or encrypted root is needed.
#    HOOKS=(base)
#
##   This setup will autodetect all modules for your system and should
##   work as a sane default
#    HOOKS=(base udev autodetect modconf block filesystems fsck)
#
##   This setup will generate a 'full' image which supports most systems.
##   No autodetection is done.
#    HOOKS=(base udev modconf block filesystems fsck)
#
##   This setup assembles a mdadm array with an encrypted root file system.
##   Note: See 'mkinitcpio -H mdadm_udev' for more information on RAID devices.
#    HOOKS=(base udev modconf keyboard keymap consolefont block mdadm_udev encrypt filesystems fsck)
#
##   This setup loads an lvm2 volume group.
#    HOOKS=(base udev modconf block lvm2 filesystems fsck)
#
##   NOTE: If you have /usr on a separate partition, you MUST include the
#    usr and fsck hooks.
# fydetab-crypt sits between block and filesystems, the slot the stock encrypt
# hook uses: the disk is there by then, and root= is still the hook's to remap
# before init resolves it. keyboard/keymap ahead of it are what make the
# passphrase promptable. See etc/initcpio/install/fydetab-crypt.
HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block fydetab-crypt filesystems fsck)

# COMPRESSION
# Use this to compress the initramfs image. By default, gzip compression
# is used. Use 'cat' to create an uncompressed image.
#COMPRESSION="zstd"
#COMPRESSION="gzip"
#COMPRESSION="bzip2"
#COMPRESSION="lzma"
#COMPRESSION="xz"
#COMPRESSION="lzop"
#COMPRESSION="lz4"

# COMPRESSION_OPTIONS
# Additional options for the compressor
#COMPRESSION_OPTIONS=()

# MODULES_DECOMPRESS
# Decompress kernel modules during initramfs creation.
# Enable to speedup boot process, disable to save RAM
# during early userspace. Switch (yes/no).
#MODULES_DECOMPRESS="yes"
