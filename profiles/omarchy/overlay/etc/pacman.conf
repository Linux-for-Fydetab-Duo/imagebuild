# /etc/pacman.conf
# 
# 
# See the pacman.conf(5) manpage for option and repository directives

# 
# GENERAL OPTIONS
# 
[options]
# IgnorePkg = 
# RootDir = /
# DBPath = /var/lib/pacman/
# CacheDir = /var/cache/pacman/pkg/
# LogFile = /var/log/pacman.log
# GPGDir = /etc/pacman.d/gnupg/
# HookDir = /etc/pacman.d/hooks/
HoldPkg = pacman glibc
# XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
# XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
# CleanMethod = KeepInstalled
Architecture = aarch64
# IgnorePkg = 
# IgnoreGroup = 
# NoUpgrade = 
# omarchy-settings ships mkinitcpio drop-ins for upstream's x86 boot stack
# (HOOKS with plymouth/encrypt/btrfs-overlayfs, MODULES+=(thunderbolt)). This
# device boots u-boot into ext4 and has none of those hooks or that module, and
# mkinitcpio treats either as a build error -- an upgrade that reinstated them
# would leave the tablet without a working initramfs. Keep them unextracted;
# /etc/mkinitcpio.conf is the only initramfs configuration on this image.
NoExtract = etc/mkinitcpio.conf.d/omarchy_hooks.conf
NoExtract = etc/mkinitcpio.conf.d/thunderbolt_module.conf
# UseSyslog
Color
ILoveCandy
# NoProgressBar
CheckSpace
# VerbosePkgLists
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
# RemoteFileSigLevel = Required

[fyde]
SigLevel = Optional TrustAll
Server = https://github.com/Linux-for-Fydetab-Duo/imagebuild/releases/download/repo

[7Ji]
SigLevel = Never
Server = https://github.com/7Ji/archrepo/releases/download/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
