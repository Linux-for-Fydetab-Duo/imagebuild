# pacman.conf used ONLY inside the build container, to populate the target rootfs.
# This is not the pacman.conf that ships in the image -- that one lives in
# overlay/etc/pacman.conf.
#
# Architecture is pinned to aarch64 so an x86_64 host pacman installs target
# packages. Package extraction is native and fast; only install scriptlets run
# emulated, via the host's qemu-aarch64 binfmt handler.

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
Color
VerbosePkgLists
ParallelDownloads = 5
SigLevel = Never
LocalFileSigLevel = Optional

# omarchy-settings' mkinitcpio drop-ins describe upstream's x86 boot stack:
# omarchy_hooks.conf sets HOOKS to include plymouth, encrypt and
# btrfs-overlayfs (the last has no install script without limine-snapper-sync),
# thunderbolt_module.conf appends a module this kernel does not build. Both are
# fatal, not cosmetic: mkinitcpio counts a missing hook or module as a build
# error and exits non-zero, and mkinitcpio's own 90-mkinitcpio-install.hook
# runs at the END of this pacstrap transaction -- so the drop-ins would break
# stage 1 before the overlay's /etc/mkinitcpio.conf is ever applied.
# The same two lines are in overlay/etc/pacman.conf so device upgrades keep
# them out too.
NoExtract = etc/mkinitcpio.conf.d/omarchy_hooks.conf
NoExtract = etc/mkinitcpio.conf.d/thunderbolt_module.conf

# The local repo. Bind-mounted to /repo in the container from imagebuild/repo/.
# Listed FIRST: for a package present in several repos pacman takes the first
# match in file order, regardless of version. That is what makes the locally
# built linux-fydetab 6.12.43 win over the published 6.1.75-3.
[fyde]
Server = file:///repo/fyde/aarch64

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo
