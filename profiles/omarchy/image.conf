# Profile: Arch Linux ARM + Omarchy (Hyprland) for the Fydetab Duo (RK3588S),
# u-boot boot chain. Sourced by build.sh and the stage scripts. Plain shell,
# no logic. Identical to profiles/arch-gnome/image.conf apart from the name and
# ROOT_FS (this profile is btrfs, arch-gnome stays on ext4).

IMG_EDITION="Omarchy-uboot"
IMG_NAME_FMT="ArchLinux-ARM-Fydetab-Duo-${IMG_EDITION}-%s"   # %s = YYYY-MM-DD

TARGET_ARCH="aarch64"
ROOT_FS="btrfs"

# Free space added on top of the populated rootfs. resizefs.service grows the
# partition to fill the medium on first boot, so this only has to cover the
# first-boot working set (pacman keyring generation, initramfs, logs).
SLACK_MIB=800

# --- Partition layout -------------------------------------------------------
# Fixed by the Rockchip boot ROM (blob offsets) and by boot.cmd (bootpart 2,
# rootpart 3). Sector size is 512 bytes throughout.
#
#   LBA 64      idblock.bin      \
#   LBA 16384   uboot.img         > inside partition 1, which reserves the region
#   LBA 24580   resource.img     /
#
#   p1  FW      64s .. 65535s        no filesystem, reserves the boot chain
#   p2  ESP     65536s .. 1114111s   FAT32, label ESP, type ef00, legacy_boot,
#                                    mounted /boot
#   p3  ROOTFS  1114112s .. end      btrfs, subvolumes @ (/), @home, @log, @pkg
#
# p1 must exist as a real GPT entry so nothing else claims those sectors; the
# ESP must be p2 and root p3 because boot.cmd hardcodes "setenv bootpart 2"
# and "setenv rootpart 3". The ESP spans 1114112 - 65536 = 1048576 sectors of
# 512 bytes, i.e. exactly 512 MiB.
PART_FW_START=64
PART_FW_END=65535
PART_ESP_START=65536
PART_ESP_END=1114111
PART_ROOT_START=1114112

UBOOT_IDBLOCK_LBA=64
UBOOT_IMG_LBA=16384
UBOOT_RESOURCE_LBA=24580

# --- Kernel -----------------------------------------------------------------
# Package name, and the paths the package must install in the rootfs tree
# (02-customize.sh asserts them there). /boot is the ESP's filesystem root, so
# boot.cmd names the same files without the /boot prefix and 04-publish.sh
# strips it before looking inside the ESP.
KERNEL_PKG="linux-fydetab"
KERNEL_IMAGE="/boot/vmlinuz-linux-fydetab"
KERNEL_INITRAMFS="/boot/initramfs-linux-fydetab.img"
# Underscore, not hyphen: the 6.12 branch renamed the dts to the FydeOS-style
# rk3588s-fydetab_duo. Must match boot.cmd's fdtfile.
KERNEL_DTB="/boot/dtbs/rockchip/rk3588s-fydetab_duo.dtb"
