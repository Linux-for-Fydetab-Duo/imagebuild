# Profile: Arch Linux ARM + Omarchy (Hyprland) for the FydeTab Duo (RK3588S),
# u-boot boot chain. Sourced by build.sh and the stage scripts. Plain shell,
# no logic. Identical to profiles/arch-gnome/image.conf apart from the name.

IMG_EDITION="Omarchy-uboot"
IMG_NAME_FMT="ArchLinux-ARM-FydeTab-Duo-${IMG_EDITION}-%s"   # %s = YYYY-MM-DD

TARGET_ARCH="aarch64"
ROOT_FS="ext4"

# Free space added on top of the populated rootfs. resizefs.service grows the
# partition to fill the medium on first boot, so this only has to cover the
# first-boot working set (pacman keyring generation, initramfs, logs).
SLACK_MIB=800

# --- Partition layout -------------------------------------------------------
# Fixed by the Rockchip boot ROM (blob offsets) and by boot.cmd (rootpart 2).
# Sector size is 512 bytes throughout.
#
#   LBA 64      idblock.bin      \
#   LBA 16384   uboot.img         > inside partition 1, which reserves the region
#   LBA 24580   resource.img     /
#
#   p1  FW      64s .. 65535s     no filesystem, reserves the boot chain
#   p2  ROOTFS  65536s .. end     ext4
#
# p1 must exist as a real GPT entry so nothing else claims those sectors, and
# root must be p2 because boot.cmd hardcodes "setenv rootpart 2".
PART_FW_START=64
PART_FW_END=65535
PART_ROOT_START=65536

UBOOT_IDBLOCK_LBA=64
UBOOT_IMG_LBA=16384
UBOOT_RESOURCE_LBA=24580

# --- Kernel -----------------------------------------------------------------
# Package name, and the file names boot.cmd expects it to install into /boot.
KERNEL_PKG="linux-fydetab"
KERNEL_IMAGE="/boot/vmlinuz-linux-fydetab"
KERNEL_INITRAMFS="/boot/initramfs-linux-fydetab.img"
# Underscore, not hyphen: the 6.12 branch renamed the dts to the FydeOS-style
# rk3588s-fydetab_duo. Must match boot.cmd's fdtfile.
KERNEL_DTB="/boot/dtbs/rockchip/rk3588s-fydetab_duo.dtb"
